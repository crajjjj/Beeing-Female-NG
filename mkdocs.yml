site_name: Beeing Female NG
site_description: Skyrim SE mod - female reproductive cycle simulation with pregnancy, birth, and child actor management.
site_url: https://crajjjj.github.io/Beeing-Female-NG/
repo_name: crajjjj/Beeing-Female-NG
repo_url: https://github.com/crajjjj/Beeing-Female-NG
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - For Players:
    - Getting Started: players/getting-started.md
    - Cycle, Sex & Conception: players/cycle-and-conception.md
    - Pregnancy & Birth: players/pregnancy-and-birth.md
    - Children: players/children.md
    - HUD Widgets: players/hud-widgets.md
    - Tattoos (SlaveTats): players/tattoos.md
    - NPC Pregnancy & Couples: players/npc-pregnancy.md
    - Couples Import: players/couples-import.md
    - Mod Integrations & Patches: players/integrations.md
    - MCM Reference: players/mcm-reference.md
  - For Mod Authors:
    - Add-on Framework: authors/add-on-framework.md
    - Papyrus ModEvents: authors/modevents.md
    - StorageUtil & State Data: authors/state-data.md
    - Pregnancy Ranks (Factions): authors/pregnancy-ranks.md
    - Item Slots & Conflicts: authors/item-slots.md
    - Building from Source: authors/building.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  links:
    not_found: warn
    anchors: warn

plugins:
  - search
