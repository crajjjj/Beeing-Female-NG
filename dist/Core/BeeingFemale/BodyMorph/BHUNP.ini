; Beeing Female NG - BodyMorph slider profile for BHUNP (UUNP Next Gen) bodies.
; BHUNP has no BreastsSH slider - it uses BreastsSSH instead.
; BHUNP also inverts some UUNP sliders relative to CBBE: BreastsSmall is applied
; with a POSITIVE weight here where CBBE 3BA.ini needs a negative one. That sign
; difference is deliberate - do not "correct" it to match the sibling profile.
; See default.ini for the format description.

[Belly]
Morph1=PregnancyBelly
Morph1Max=1.0

[Breasts]
Morph1=BreastsSSH
Morph1Max=0.4
Morph2=DoubleMelon
Morph2Max=0.25
Morph3=BreastsSmall
Morph3Max=0.1
